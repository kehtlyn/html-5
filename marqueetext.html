<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>marquees</title>
</head>
<body>
    <h1>marquee text</h1>
    <marquee behavior="scroll" scrollamount="04" direction="down" style="color: rgb(196, 18, 18);" >this marquee is sliding downwards</marquee>
    <br>

    <marquee behavior="scroll" scrollamount="04" direction="up">this marquee is sliding upwards</marquee>

    <marquee behavior="scroll" scrollamount="10" direction="left" loop="4">
        <img src="/images/CATE.jpg" alt="" width="300px">
        </marquee>

    <marquee behavior="scroll" scrollamount="10" direction="right">this marquee is sliding to the right</marquee>
    
</body>
</html>
